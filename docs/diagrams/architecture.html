<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekhani — arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Mekhani — freelance pipeline</h1>
    <p class="sub">Scrape → score contra tu perfil → propuesta via Claude → Google Doc → Telegram. Dos corridas al dia por APScheduler.</p>

    <svg viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mk-title mk-desc">
      <title id="mk-title">Mekhani: scrapers a propuestas</title>
      <desc id="mk-desc">scrapers/ extrae de Upwork (MCP), Fiverr (Apify) y Freelancer (API); score_and_filter califica contra config/profiles.yaml; generators crea propuestas con Claude y un Google Doc; apply_and_notify avisa por Telegram; scheduler.py corre 9am y 6pm.</desc>
      <defs>
        <marker id="mk-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="mk-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="460" fill="#f5f5f5"/>

      <!-- scrapers -->
      <rect x="40" y="70" width="200" height="170" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="140" y="94" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SCRAPERS/</text>
      <g font-family="'Geist Mono', monospace" font-size="9.5" fill="#2d3142">
        <rect x="60" y="110" width="160" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="140" y="130" text-anchor="middle">upwork.py — MCP</text>
        <rect x="60" y="150" width="160" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="140" y="170" text-anchor="middle">fiverr.py — Apify</text>
        <rect x="60" y="190" width="160" height="32" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/><text x="140" y="210" text-anchor="middle">freelancer.py — API</text>
      </g>

      <!-- score -->
      <rect x="300" y="100" width="210" height="90" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="405" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">score_and_filter.py</text>
      <text x="405" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keyword + hybrid scoring</text>
      <text x="405" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contra config/profiles.yaml</text>

      <!-- generate -->
      <rect x="560" y="60" width="230" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="675" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">generators/proposal.py</text>
      <text x="675" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude API · 35-word preview + full</text>

      <rect x="560" y="140" width="230" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="675" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">generators/docs.py</text>
      <text x="675" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Google Doc con breakdown + Mermaid</text>

      <!-- notify -->
      <rect x="840" y="100" width="220" height="90" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="950" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">apply_and_notify.py</text>
      <text x="950" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Telegram con doc link</text>
      <text x="950" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ detalles del job</text>

      <!-- scheduler -->
      <rect x="300" y="230" width="490" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="545" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scheduler.py / main.py</text>
      <text x="545" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">APScheduler 9am + 6pm · o systemd · --once --dry-run</text>

      <!-- edges -->
      <path d="M 240 156 L 270 156 Q 280 156 280 146 L 280 142 Q 280 138 290 138 L 300 138" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mk-arrow)"/>
      <path d="M 510 130 L 540 130 Q 550 130 550 120 L 550 100 Q 550 92 560 92 L 560 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mk-arrow)"/>
      <path d="M 510 155 L 540 155 Q 550 155 550 162 L 550 166 Q 550 172 560 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mk-arrow)"/>
      <path d="M 790 92 L 820 92 Q 830 92 830 102 L 830 130 Q 830 140 840 140 L 840 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mk-arrow)"/>
      <path d="M 790 172 L 840 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mk-arrow)"/>
      <path d="M 545 290 L 545 310 L 405 310 L 405 190" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#mk-arrow)"/>
      <text x="480" y="320" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">dispara pipeline</text>

      <!-- footer -->
      <rect x="40" y="330" width="1020" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="550" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Positronica Labs · construido sobre positronica_core shared library</text>
      <text x="550" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config/platforms.yaml + profiles.yaml · playwright para browser automation</text>
    </svg>
  </div>
</body>
</html>
